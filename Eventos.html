<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
        <a class="navbar-brand" href="#">Gestionar Eventos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="Clientes.html">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Eventos.html">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Salones.html">Salones</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <section class="text-center mb-5">
            <h1 class="fw-bold">Eventos</h1>
        </section>

        <section class="card shadow-sm mb-5">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0">Agregar Datos: </h2>
            </div>

            <div class="card-body">
                <form id="formulario">
                    <input type="hidden" id="idEvento">

                    <div class="form-group my-3">
                        <label for="txtNombreEvento" class="form-label">Nombre</label>
                        <input type="text" id="txtNombreEvento" class="form-Control" required>
                    </div>
                    <div class="form-group my-3">
                        <label for="Fecha" class="form-label">Fecha</label>
                        <input type="date" id="Fecha" class="form-Control" required>
                    </div>
                    <div class="form-group my-3">
                        <label for="CantidadPersonas" class="form-label">Cantidad de personas</label>
                        <input type="text" id="CantidadPersonas" class="form-Control" required>
                    </div>
                    <div class="form-group my-3">
                        <label for="CantidadHoras" class="form-label">Cantidad de horas</label>
                        <input type="text" id="CantidadHoras" class="form-Control" required>
                    </div>
                    <div class="form-group my-3">
                        <select class="form-select" id="txtEstado" aria-label="Default select example">
                            <option selected>Elige un estado</option>
                        </select>
                    </div>
                    <div class="form-group my-3">
                        <label for="TotalPago" class="form-label">TotalPago</label>
                        <input type="text" id="TotalPago" class="form-Control" required>
                    </div>
                    <div class="form-group my-3">
                        <select class="form-select" id="txtCliente" aria-label="Default select example">
                            <option selected>Elige un cliente</option>
                        </select>
                    </div>
                    <div class="form-group my-3">
                        <select class="form-select" id="txtSalon" aria-label="Default select example">
                            <option selected>Elige un salon</option>
                        </select>
                    </div>
                    <div class="my-3">
                        <button type="submit" id="btnGuardar" class="btn btn-success">Guardar</button>
                        <button type="button" id="btnCancelar" class="btn btn-secondary d-none">Cancelar</button>
                    </div>
                </form>
            </div>
        </section>
        <section class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-5">Lista</h2>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-stripped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Id</th>
                                <th>Nombre</th>
                                <th>Fecha</th>
                                <th>Cantidad de personas</th>
                                <th>Cantidad de horas</th>
                                <th>Estado</th>
                                <th>Total Pago</th>
                                <th>Cliente</th>
                                <th>Salon</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEventos">

                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>


    <script type="module" src="js/controller/eventosController.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
